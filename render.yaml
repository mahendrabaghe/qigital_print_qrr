services:
  - type: web
    name: print-shop-api
    runtime: node
    buildCommand: npm --prefix server ci && npm --prefix server run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://mahendrabaghe.github.io/qigital_print_qrr
      - key: CORS_ORIGINS
        value: https://mahendrabaghe.github.io
      - key: PRINT_MODE
        value: demo
