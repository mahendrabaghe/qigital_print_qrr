services:
  - type: web
    name: print-shop-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://mahendrabaghe.github.io/print
      - key: CORS_ORIGINS
        value: https://mahendrabaghe.github.io
      - key: PRINT_MODE
        value: demo
